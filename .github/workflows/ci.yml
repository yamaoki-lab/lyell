# PR の Go のコードを, 使う予定のある対象 (サーバの Linux, ネイティブクライアントの macOS, Windows, Android, 研究室の機体の linux/arm64) で確かめる.
# ファイルの同期や rename は OS ごとに振る舞いが違い, OS ごとのファイル (sync_dir_windows.go 等) もあるので, 1つの OS だけでは足りない.
name: CI

on:
  pull_request:
  # main に入った後にも走らせて, main にキャッシュを作る. PR が借りられるのは main のキャッシュだけで, PR 同士では借りられない.
  push:
    branches: [main]

permissions:
  contents: read

# 同じ PR に続けて push したら, 古い方の実行は止める.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # PR の画面と Ruleset に出る確認の名前. matrix の値を全部並べた名前にならないようにする.
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu は latest ではなく, 研究室の機械に合わせて固定する. x64 はホストと同じ 26.04, arm64 は Jetson の JetPack と同じ 24.04. 研究室の機械を上げた時に, ここも上げる.
        include:
          # データの競合の検出 (-race) は重いので, x64 の Linux だけで行う.
          - os: ubuntu-26.04
            race: -race
          # 研究室の機体 (Jetson 等) と同じ arm64 の Linux で, テストを実際に回す.
          - os: ubuntu-24.04-arm
            race: ""
          - os: macos-latest
            race: ""
          - os: windows-latest
            race: ""
    runs-on: ${{ matrix.os }}
    # 止まらなくなった時に, 既定の6時間まで走らせ続けないようにする.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod # yamaoki-lint:ignore
          # 生成の道具は別のモジュール (tools/go.mod) にあるので, その go.sum もキャッシュの鍵に入れる.
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: gofmt
        if: matrix.os == 'ubuntu-26.04'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt が必要なファイル:"
            echo "$unformatted"
            exit 1
          fi
      # buf は tools/go.mod で固定したものを使う. 手元と同じものが走る.
      - name: buf lint
        if: matrix.os == 'ubuntu-26.04'
        run: go tool -modfile=tools/go.mod buf lint
      - name: buf format
        if: matrix.os == 'ubuntu-26.04'
        run: go tool -modfile=tools/go.mod buf format -d --exit-code
      # main と比べて, 互換を壊す変更が無いかを見る. main にまだ proto/ が無い時は, 比べる相手が無いので飛ばす.
      - name: buf breaking
        if: matrix.os == 'ubuntu-26.04'
        run: |
          git fetch --depth=1 origin main:refs/remotes/origin/main
          if git ls-tree -d --name-only origin/main proto | grep -q .; then
            go tool -modfile=tools/go.mod buf breaking --against ".git#ref=refs/remotes/origin/main"
          else
            echo "main に proto/ が無いので飛ばします"
          fi
      # Go の生成物はリポジトリに置いているので, 生成し直して .proto と食い違っていないかを確かめる.
      - name: buf generate
        if: matrix.os == 'ubuntu-26.04'
        run: |
          go tool -modfile=tools/go.mod buf generate
          changed=$(git status --porcelain gen)
          if [ -n "$changed" ]; then
            echo "生成し直すと変わるファイル:"
            echo "$changed"
            git diff gen
            exit 1
          fi
      - run: go vet ./...
      # Android はテストを回す環境が無いので, コンパイルが通るかと go vet の点検だけを見る.
      - name: go vet (android/arm64)
        if: matrix.os == 'ubuntu-26.04'
        run: GOOS=android GOARCH=arm64 go vet ./...
      # golangci-lint は新しいリリースで検査が増え, 関係の無い PR が落ちうるので, バージョンを固定する. 上げる時は, 増えた指摘を直す PR と一緒にする.
      # OS ごとのファイル (sync_dir_windows.go 等) も点検するため, Linux と Windows を対象に2回走らせる.
      - name: golangci-lint (linux)
        if: matrix.os == 'ubuntu-26.04'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0 # yamaoki-lint:ignore
      - name: golangci-lint (windows)
        if: matrix.os == 'ubuntu-26.04'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOOS: windows
        with:
          version: v2.15.0 # yamaoki-lint:ignore
          # キャッシュは1回目の分を保存する. 同じ鍵で2回保存しようとして警告が出ないようにする.
          skip-save-cache: true
      - run: go test ${{ matrix.race }} ./...
