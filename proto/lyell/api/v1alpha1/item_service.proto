syntax = "proto3";

package lyell.api.v1alpha1;

import "google/protobuf/field_mask.proto";
import "lyell/api/v1alpha1/item.proto";

option go_package = "github.com/yamaoki-lab/lyell/gen/lyell/api/v1alpha1;apiv1alpha1";

// ItemService は, item と revision の作成および取得を行う.
//
// 中身のバイト列 (blob) は, この RPC とは別に, 通常の HTTP で /lyell/api/v1alpha1/blobs/sha256/<hex> に保存および取得する. RPC では SHA-256 のみを受け渡す.
service ItemService {
  // CreateItem は, item を, 保存済みの blob を指す最初の revision と共に作成する. 現在は asset のみを作成できる.
  // blob_sha256 を指定した際に blob が存在しなければ, FAILED_PRECONDITION を返す.
  rpc CreateItem(CreateItemRequest) returns (CreateItemResponse);

  // GetItem は, item を返す. 存在しなければ NOT_FOUND を返す.
  rpc GetItem(GetItemRequest) returns (GetItemResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListItems は, item を, head の revision と共にページ単位で返す. 絞り込み (filter, AIP-160), 並び順 (order_by, AIP-132), 続きの取得 (page_token, AIP-158) は Google の API 設計指針に従う.
  rpc ListItems(ListItemsRequest) returns (ListItemsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetRevision は, revision を, 親の一覧と共に返す. 存在しなければ NOT_FOUND を返す.
  rpc GetRevision(GetRevisionRequest) returns (GetRevisionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // CommitRevision は, item に revision を追加し, item の head をその revision へ進める. fast-forward のみを受け付ける.
  // 統合でない (親が1つの) revision の content が, expected_head の revision と同じなら, 何も記録せずに INVALID_ARGUMENT を返す.
  // head が expected_head から変更されていたら, 何も記録せずに ABORTED を返し, 詳細情報に HeadMoved を付与する.
  // blob が存在しなければ, FAILED_PRECONDITION を返す. 引き継ぎ元となる expected_head の revision が間引かれていても, FAILED_PRECONDITION を返す.
  rpc CommitRevision(CommitRevisionRequest) returns (CommitRevisionResponse);
}

// CreateItemRequest は, CreateItem のリクエスト.
message CreateItemRequest {
  reserved 2;
  reserved "blob_sha256";

  // kind は item の種類. 現在は ITEM_KIND_ASSET のみを受け付ける.
  ItemKind kind = 1;
  // content は, 最初の revision の中身. blob_sha256 は validate_only が true の場合に限り省略できる. 指定する場合は, blob を事前に保存しておく必要がある. name は省略でき, 省略すると名前のない revision になる. 出力専用のフィールドは, 設定しても無視する.
  RevisionContent content = 3;
  // validate_only が true なら, リクエストを検証し, 何も保存せずにレスポンスを返す. blob_sha256 を省略した場合は blob の検証を省略する. 検証に失敗した場合は, validate_only が false の場合と同じエラーと詳細情報を返す.
  bool validate_only = 4;
}

// CreateItemResponse は, CreateItem のレスポンス.
message CreateItemResponse {
  // item は, 作成した item. validate_only が true の場合, id と head は空になる.
  Item item = 1;
  // revision は, 作成した最初の revision. validate_only が true の場合, id, item_id, content.create_time は空になる. リクエストで blob_sha256 を省略した場合は, content.blob_sha256 と content.blob_size も空になる.
  Revision revision = 2;
}

// GetItemRequest は, GetItem のリクエスト.
message GetItemRequest {
  // id は, 取得する item の ID.
  string id = 1;
}

// GetItemResponse は, GetItem のレスポンス.
message GetItemResponse {
  // item は, 取得した item.
  Item item = 1;
}

// ListItemsRequest は, ListItems のリクエスト.
message ListItemsRequest {
  // page_size は, 1ページあたりに返す最大件数. 0 の場合は 128 件. 1024 を超える値は 1024 として扱う. 負の値は INVALID_ARGUMENT になる.
  int32 page_size = 1;
  // page_token は, 前のレスポンスの next_page_token. 空なら先頭から返す. page_size 以外のフィールドは, そのトークンを受け取った時と同じ値を指定する. 異なる場合は INVALID_ARGUMENT になる.
  string page_token = 2;
  // filter は, 返す item の条件 (AIP-160). フィールド名は ItemEntry を起点に指定する. 空なら全ての item を返す.
  // 現在受け付けるのは, item.kind の等値比較と, head_revision.content.create_time (最後に head を進めた時刻) の比較を, AND で結合した条件のみ. それ以外は INVALID_ARGUMENT になる.
  // 例: `item.kind = ITEM_KIND_ASSET AND head_revision.content.create_time >= "2026-10-01T00:00:00Z"`
  string filter = 3;
  // order_by は, 並び順 (AIP-132). フィールド名は ItemEntry を起点に指定する. 空なら "item.id desc" (新しい順). 現在受け付けるのは "item.id" (古い順) と "item.id desc" のみで, それ以外は INVALID_ARGUMENT になる.
  string order_by = 4;
}

// ListItemsResponse は, ListItems のレスポンス.
message ListItemsResponse {
  // entries は, このページの item 一覧. order_by で指定された順に並ぶ.
  repeated ItemEntry entries = 1;
  // next_page_token は, 次ページを取得する際に page_token に渡す値. 空なら最後のページ.
  string next_page_token = 2;
  // total_size は, filter に一致する item の総数 (全ページの合計).
  int32 total_size = 3;
}

// ItemEntry は, ListItems が返す1件分のデータ. item と, その head の revision が必ず組で取得できるよう, 1つのメッセージにまとめている.
message ItemEntry {
  // item は, item.
  Item item = 1;
  // head_revision は, item の head の revision. 親の一覧を含む.
  Revision head_revision = 2;
}

// GetRevisionRequest は, GetRevision のリクエスト.
message GetRevisionRequest {
  // id は, 取得する revision の ID.
  string id = 1;
}

// GetRevisionResponse は, GetRevision のレスポンス.
message GetRevisionResponse {
  // revision は, 取得した revision.
  Revision revision = 1;
}

// CommitRevisionRequest は, CommitRevision のリクエスト.
message CommitRevisionRequest {
  reserved 4;
  reserved "blob_sha256";

  // item_id は, revision を追加する item の ID.
  string item_id = 1;
  // expected_head は, 呼び出し元が想定している現在の head. 現在の head と異なれば ABORTED を返す.
  string expected_head = 2;
  // parents は, 新しい revision の親となる revision の ID. 空なら expected_head のみを親にする (最も一般的な fast-forward). 指定する場合は expected_head を必ず含める. 現在の上限は2つで, 超えると INVALID_ARGUMENT を返す. 上限は今後引き上げる可能性がある.
  repeated string parents = 3;
  // content は, 新しい revision の中身. update_mask で変更の対象にしなかったフィールドは, expected_head の revision から引き継ぐ. blob_sha256 を変更する場合は, blob を事前に保存しておく必要がある. 出力専用のフィールドは, 設定しても無視する.
  RevisionContent content = 5;
  // update_mask は, content のうち変更するフィールド (AIP-134). パスには content 内のフィールド名 (例: blob_sha256) を指定する. 省略するか空の場合は, content で値が設定されているフィールドを変更する.
  // 値を空にしたフィールドを指定すると, そのフィールドを消去する. ただし blob_sha256 は消去できず, INVALID_ARGUMENT になる. ワイルドカード "*" や存在しないフィールド名も INVALID_ARGUMENT になる. 出力専用のフィールドは, 指定しても無視する.
  google.protobuf.FieldMask update_mask = 6;
  // validate_only が true なら, リクエストを検証し, 何も保存せずにレスポンスを返す. 検証に失敗した場合は, validate_only が false の場合と同じエラーと詳細情報を返す.
  bool validate_only = 7;
}

// CommitRevisionResponse は, CommitRevision のレスポンス.
message CommitRevisionResponse {
  // revision は, 追加した revision. item の head は, この revision の ID へ進められる. validate_only が true の場合, id と content.create_time は空になり, item の head は変わらない.
  Revision revision = 1;
}

// HeadMoved は, CommitRevision が ABORTED を返す際に付与する詳細情報. 呼び出し元は, 再取得せずに現在の head を取得し, 分岐の解決へ進めることができる.
message HeadMoved {
  // current_head は, リクエストが拒否された時点の item の head.
  string current_head = 1;
}

// NameSuggestion は, CreateItem または CommitRevision が content.name を拒否した際, 候補を作成できた場合にのみ付与する詳細情報.
message NameSuggestion {
  // name は, 拒否された名前の規則違反をすべて修正した候補.
  string name = 1;
}

// FieldViolationReason は, ItemService が INVALID_ARGUMENT を返す時の拒否理由.
// INVALID_ARGUMENT には詳細情報として google.rpc.BadRequest (AIP-193) を付与する. field_violations の field はリクエスト内のフィールドのパス (例: content.blob_sha256, parents[1]. 添字は0から数える), reason は値の名前から接頭辞 FIELD_VIOLATION_REASON_ を除いたもの (例: ID_MALFORMED), description は日本語の説明.
// クライアントは reason で理由を判別し, 独自のメッセージを表示できる.
enum FieldViolationReason {
  // FIELD_VIOLATION_REASON_UNSPECIFIED は使用しない.
  FIELD_VIOLATION_REASON_UNSPECIFIED = 0;
  // FIELD_VIOLATION_REASON_ID_MALFORMED は, ID が応答で返す表記 (小文字でハイフン区切りの36文字) ではないこと. 空の場合も含む.
  FIELD_VIOLATION_REASON_ID_MALFORMED = 1;
  // FIELD_VIOLATION_REASON_BLOB_SHA256_MALFORMED は, SHA-256 が小文字の16進数64文字ではないこと.
  FIELD_VIOLATION_REASON_BLOB_SHA256_MALFORMED = 2;
  // FIELD_VIOLATION_REASON_KIND_UNSPECIFIED は, item の種類が指定されていないこと.
  FIELD_VIOLATION_REASON_KIND_UNSPECIFIED = 3;
  // FIELD_VIOLATION_REASON_KIND_UNKNOWN は, item の種類が ItemKind に存在しない値であること.
  FIELD_VIOLATION_REASON_KIND_UNKNOWN = 4;
  // FIELD_VIOLATION_REASON_KIND_UNSUPPORTED は, item の種類は ItemKind に存在するが, まだ作成できないこと (ITEM_KIND_COLLECTION).
  FIELD_VIOLATION_REASON_KIND_UNSUPPORTED = 5;
  // FIELD_VIOLATION_REASON_PARENTS_TOO_MANY は, parents の数が上限を超えていること.
  FIELD_VIOLATION_REASON_PARENTS_TOO_MANY = 6;
  // FIELD_VIOLATION_REASON_PARENTS_DUPLICATE は, 同じ親が2回以上指定されていること. field は2つ目の親を指す.
  FIELD_VIOLATION_REASON_PARENTS_DUPLICATE = 7;
  // FIELD_VIOLATION_REASON_PARENTS_MISSING_EXPECTED_HEAD は, parents に expected_head が含まれていないこと.
  FIELD_VIOLATION_REASON_PARENTS_MISSING_EXPECTED_HEAD = 8;
  // FIELD_VIOLATION_REASON_PAGE_SIZE_NEGATIVE は, page_size が負の値であること.
  FIELD_VIOLATION_REASON_PAGE_SIZE_NEGATIVE = 9;
  // FIELD_VIOLATION_REASON_PAGE_TOKEN_MALFORMED は, page_token が, ListItems の返した next_page_token の形式ではないこと.
  FIELD_VIOLATION_REASON_PAGE_TOKEN_MALFORMED = 10;
  // FIELD_VIOLATION_REASON_PAGE_TOKEN_MISMATCH は, page_token を next_page_token として返したリクエストと, filter または order_by が異なること.
  FIELD_VIOLATION_REASON_PAGE_TOKEN_MISMATCH = 11;
  // FIELD_VIOLATION_REASON_BLOB_SHA256_REQUIRED は, 必須の blob_sha256 が空であること. CommitRevision では, update_mask に blob_sha256 を指定して値を空にした場合.
  FIELD_VIOLATION_REASON_BLOB_SHA256_REQUIRED = 12;
  // FIELD_VIOLATION_REASON_UPDATE_MASK_WILDCARD は, update_mask にワイルドカード "*" が指定されていること. field は update_mask.paths[i].
  FIELD_VIOLATION_REASON_UPDATE_MASK_WILDCARD = 13;
  // FIELD_VIOLATION_REASON_UPDATE_MASK_FIELD_UNKNOWN は, update_mask のパスが content に存在しないフィールドを指していること. field は update_mask.paths[i].
  FIELD_VIOLATION_REASON_UPDATE_MASK_FIELD_UNKNOWN = 14;
  // FIELD_VIOLATION_REASON_REVISION_UNCHANGED は, 親が1つの revision の content が, 出力専用のフィールドを除いて expected_head の revision と同じであること. field は content. 親が2つ (統合) なら, 同じでも受け付ける.
  FIELD_VIOLATION_REASON_REVISION_UNCHANGED = 15;
  // FIELD_VIOLATION_REASON_NAME_FORBIDDEN_CHARACTER は, 名前が Windows のファイル名に使えない文字 (< > : " / \ | ? *) を含むこと. field は content.name. 以下の NAME_ で始まる理由はどれも, 自動修正の後の名前に対するもの.
  FIELD_VIOLATION_REASON_NAME_FORBIDDEN_CHARACTER = 16;
  // FIELD_VIOLATION_REASON_NAME_BIDI_CONTROL は, 名前が双方向テキストの制御文字 (U+202A から U+202E, U+2066 から U+2069) を含むこと. field は content.name.
  FIELD_VIOLATION_REASON_NAME_BIDI_CONTROL = 17;
  // FIELD_VIOLATION_REASON_NAME_TRAILING_PERIOD は, 名前がピリオドで終わること. field は content.name.
  FIELD_VIOLATION_REASON_NAME_TRAILING_PERIOD = 18;
  // FIELD_VIOLATION_REASON_NAME_RESERVED は, 名前が "." か "..", または Windows の予約名 (CON, PRN, AUX, NUL, COM1 から COM9, COM¹ から COM³, LPT1 から LPT9, LPT¹ から LPT³) であること. 予約名は大文字小文字を区別せず, NUL.txt のように拡張子が続く場合も含む. field は content.name.
  FIELD_VIOLATION_REASON_NAME_RESERVED = 19;
  // FIELD_VIOLATION_REASON_NAME_TOO_LONG は, 名前が NFC と NFD のどちらかで, UTF-8 で 255 バイトを超えること. field は content.name.
  FIELD_VIOLATION_REASON_NAME_TOO_LONG = 20;
  // FIELD_VIOLATION_REASON_NAME_BLANK は, 空でない名前が, 自動修正の後に空になること (空白だけの名前など). field は content.name.
  FIELD_VIOLATION_REASON_NAME_BLANK = 21;
  // FIELD_VIOLATION_REASON_FILTER_SYNTAX は, filter が AIP-160 の構文に従っていないこと. field は filter. 以下の FILTER_ で始まる理由の field はどれも filter.
  FIELD_VIOLATION_REASON_FILTER_SYNTAX = 22;
  // FIELD_VIOLATION_REASON_FILTER_FIELD_UNKNOWN は, filter のフィールドパスが ItemEntry に存在しないこと (フィールド名の誤記など).
  FIELD_VIOLATION_REASON_FILTER_FIELD_UNKNOWN = 23;
  // FIELD_VIOLATION_REASON_FILTER_FIELD_UNSUPPORTED は, filter のフィールドパスは ItemEntry に存在するが, まだ絞り込みに使えないこと (item.id など).
  FIELD_VIOLATION_REASON_FILTER_FIELD_UNSUPPORTED = 24;
  // FIELD_VIOLATION_REASON_FILTER_OPERATOR_UNSUPPORTED は, 使用できない演算子 (OR, NOT, != など) か, そのフィールドでは使えない演算子を指定していること. 比較か, 比較を AND で結合したもの以外の式も含む.
  FIELD_VIOLATION_REASON_FILTER_OPERATOR_UNSUPPORTED = 25;
  // FIELD_VIOLATION_REASON_FILTER_VALUE_INVALID は, 比較の値がフィールドに合わないこと. 型の合わない値, ITEM_KIND_ASSET と ITEM_KIND_COLLECTION 以外の item.kind, RFC 3339 の文字列でない時刻を含む.
  FIELD_VIOLATION_REASON_FILTER_VALUE_INVALID = 26;
  // FIELD_VIOLATION_REASON_FILTER_FIELD_REPEATED は, item.kind を2回以上指定していること.
  FIELD_VIOLATION_REASON_FILTER_FIELD_REPEATED = 27;
  // FIELD_VIOLATION_REASON_ORDER_BY_SYNTAX は, order_by が AIP-132 の構文に従っていないこと. AIP-132 に定義のない "asc" も含む. field は order_by. 以下の ORDER_BY_ で始まる理由の field はどれも order_by.
  FIELD_VIOLATION_REASON_ORDER_BY_SYNTAX = 28;
  // FIELD_VIOLATION_REASON_ORDER_BY_FIELD_UNKNOWN は, order_by のフィールドパスが ItemEntry に存在しないこと.
  FIELD_VIOLATION_REASON_ORDER_BY_FIELD_UNKNOWN = 29;
  // FIELD_VIOLATION_REASON_ORDER_BY_FIELD_UNSUPPORTED は, order_by のフィールドパスは ItemEntry に存在するが, まだ並び順に使えないこと (item.kind など).
  FIELD_VIOLATION_REASON_ORDER_BY_FIELD_UNSUPPORTED = 30;
  // FIELD_VIOLATION_REASON_ORDER_BY_TOO_MANY_FIELDS は, order_by に2つ以上のフィールドを指定していること.
  FIELD_VIOLATION_REASON_ORDER_BY_TOO_MANY_FIELDS = 31;
}
