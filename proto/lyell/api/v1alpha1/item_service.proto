syntax = "proto3";

package lyell.api.v1alpha1;

import "lyell/api/v1alpha1/item.proto";

option go_package = "github.com/yamaoki-lab/lyell/gen/lyell/api/v1alpha1;apiv1alpha1";

// ItemService は, item と revision の作成および取得を行う.
//
// 中身のバイト列 (blob) は, この RPC とは別に, 通常の HTTP で /lyell/api/v1alpha1/blobs/sha256/<hex> に保存および取得する. RPC では SHA-256 のみを受け渡す.
service ItemService {
  // CreateItem は, item を, 保存済みの blob を指す最初の revision と共に作成する. 現在は asset のみを作成できる.
  // blob が存在しなければ, FAILED_PRECONDITION を返す.
  rpc CreateItem(CreateItemRequest) returns (CreateItemResponse);

  // GetItem は, item を返す. 存在しなければ NOT_FOUND を返す.
  rpc GetItem(GetItemRequest) returns (GetItemResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListItems は, item を, head の revision と共にページ単位で返す. 絞り込み (filter, AIP-160), 並び順 (order_by, AIP-132), 続きの取得 (page_token, AIP-158) は Google の API 設計指針に従う.
  rpc ListItems(ListItemsRequest) returns (ListItemsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetRevision は, revision を, 親の一覧と共に返す. 存在しなければ NOT_FOUND を返す.
  rpc GetRevision(GetRevisionRequest) returns (GetRevisionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // CommitRevision は, item に revision を追加し, item の head をその revision へ進める. fast-forward のみを受け付ける.
  // head が expected_head から変更されていたら, 何も記録せずに ABORTED を返し, 詳細情報に HeadMoved を付与する.
  // blob が存在しなければ, FAILED_PRECONDITION を返す.
  rpc CommitRevision(CommitRevisionRequest) returns (CommitRevisionResponse);
}

// CreateItemRequest は, CreateItem のリクエスト.
message CreateItemRequest {
  reserved 2;
  reserved "blob_sha256";

  // kind は item の種類. 現在は ITEM_KIND_ASSET のみを受け付ける.
  ItemKind kind = 1;
  // content は, 最初の revision の中身. blob_sha256 は必須で, blob を事前に保存しておく必要がある. blob_sha256 以外のフィールドは出力専用で, 設定しても無視する.
  RevisionContent content = 3;
}

// CreateItemResponse は, CreateItem のレスポンス.
message CreateItemResponse {
  // item は, 作成した item.
  Item item = 1;
  // revision は, 作成した最初の revision.
  Revision revision = 2;
}

// GetItemRequest は, GetItem のリクエスト.
message GetItemRequest {
  // id は, 取得する item の ID.
  string id = 1;
}

// GetItemResponse は, GetItem のレスポンス.
message GetItemResponse {
  // item は, 取得した item.
  Item item = 1;
}

// ListItemsRequest は, ListItems のリクエスト.
message ListItemsRequest {
  // page_size は, 1ページあたりに返す最大件数. 0 の場合は 128 件. 1024 を超える値は 1024 として扱う. 負の値は INVALID_ARGUMENT になる.
  int32 page_size = 1;
  // page_token は, 前のレスポンスの next_page_token. 空なら先頭から返す. page_size 以外のフィールドは, そのトークンを受け取った時と同じ値を指定する. 異なる場合は INVALID_ARGUMENT になる.
  string page_token = 2;
  // filter は, 返す item の条件 (AIP-160). フィールド名は ItemEntry を起点に指定する. 空なら全ての item を返す.
  // 現在受け付けるのは, item.kind の等値比較と, head_revision.content.create_time (最後に head を進めた時刻) の比較を, AND で結合した条件のみ. それ以外は INVALID_ARGUMENT になる.
  // 例: `item.kind = ITEM_KIND_ASSET AND head_revision.content.create_time >= "2026-10-01T00:00:00Z"`
  string filter = 3;
  // order_by は, 並び順 (AIP-132). フィールド名は ItemEntry を起点に指定する. 空なら "item.id desc" (新しい順). 現在受け付けるのは "item.id" (古い順) と "item.id desc" のみで, それ以外は INVALID_ARGUMENT になる.
  string order_by = 4;
}

// ListItemsResponse は, ListItems のレスポンス.
message ListItemsResponse {
  // entries は, このページの item 一覧. order_by で指定された順に並ぶ.
  repeated ItemEntry entries = 1;
  // next_page_token は, 次ページを取得する際に page_token に渡す値. 空なら最後のページ.
  string next_page_token = 2;
  // total_size は, filter に一致する item の総数 (全ページの合計).
  int32 total_size = 3;
}

// ItemEntry は, ListItems が返す1件分のデータ. item と, その head の revision が必ず組で取得できるよう, 1つのメッセージにまとめている.
message ItemEntry {
  // item は, item.
  Item item = 1;
  // head_revision は, item の head の revision. 親の一覧を含む.
  Revision head_revision = 2;
}

// GetRevisionRequest は, GetRevision のリクエスト.
message GetRevisionRequest {
  // id は, 取得する revision の ID.
  string id = 1;
}

// GetRevisionResponse は, GetRevision のレスポンス.
message GetRevisionResponse {
  // revision は, 取得した revision.
  Revision revision = 1;
}

// CommitRevisionRequest は, CommitRevision のリクエスト.
message CommitRevisionRequest {
  reserved 4;
  reserved "blob_sha256";

  // item_id は, revision を追加する item の ID.
  string item_id = 1;
  // expected_head は, 呼び出し元が想定している現在の head. 現在の head と異なれば ABORTED を返す.
  string expected_head = 2;
  // parents は, 新しい revision の親となる revision の ID. 空なら expected_head のみを親にする (最も一般的な fast-forward). 指定する場合は expected_head を必ず含める. 現在の上限は2つで, 超えると INVALID_ARGUMENT を返す. 上限は今後引き上げる可能性がある.
  repeated string parents = 3;
  // content は, 新しい revision の中身. blob_sha256 は必須で, blob を事前に保存しておく必要がある. blob_sha256 以外のフィールドは出力専用で, 設定しても無視する.
  RevisionContent content = 5;
}

// CommitRevisionResponse は, CommitRevision のレスポンス.
message CommitRevisionResponse {
  // revision は, 追加した revision. item の head は, この revision の ID へ進められる.
  Revision revision = 1;
}

// HeadMoved は, CommitRevision が ABORTED を返す時に付与する詳細情報. 呼び出し元は, 再取得せずに現在の head を取得し, 分岐の解決へ進めることができる.
message HeadMoved {
  // current_head は, リクエストが拒否された時点の item の head.
  string current_head = 1;
}

// FieldViolationReason は, ItemService が INVALID_ARGUMENT を返す時の拒否の理由.
// INVALID_ARGUMENT には詳細情報として google.rpc.BadRequest (AIP-193) を付与する. field_violations の field はリクエスト内のフィールドのパス (例: content.blob_sha256, parents[1]. 添字は0から数える), reason は値の名前から接頭辞 FIELD_VIOLATION_REASON_ を除いたもの (例: ID_MALFORMED), description は日本語の説明.
// クライアントは reason で理由を判別し, 独自のメッセージを表示できる. filter と order_by の拒否には, まだ reason を設定しない.
enum FieldViolationReason {
  // FIELD_VIOLATION_REASON_UNSPECIFIED は使用しない.
  FIELD_VIOLATION_REASON_UNSPECIFIED = 0;
  // FIELD_VIOLATION_REASON_ID_MALFORMED は, ID が応答で返す表記 (小文字でハイフン区切りの36文字) ではないこと. 空の場合も含む.
  FIELD_VIOLATION_REASON_ID_MALFORMED = 1;
  // FIELD_VIOLATION_REASON_BLOB_SHA256_MALFORMED は, SHA-256 が小文字の16進数64文字ではないこと.
  FIELD_VIOLATION_REASON_BLOB_SHA256_MALFORMED = 2;
  // FIELD_VIOLATION_REASON_KIND_UNSPECIFIED は, item の種類が指定されていないこと.
  FIELD_VIOLATION_REASON_KIND_UNSPECIFIED = 3;
  // FIELD_VIOLATION_REASON_KIND_UNKNOWN は, item の種類が ItemKind に存在しない値であること.
  FIELD_VIOLATION_REASON_KIND_UNKNOWN = 4;
  // FIELD_VIOLATION_REASON_KIND_UNSUPPORTED は, item の種類は ItemKind に存在するが, まだ作成できないこと (ITEM_KIND_COLLECTION).
  FIELD_VIOLATION_REASON_KIND_UNSUPPORTED = 5;
  // FIELD_VIOLATION_REASON_PARENTS_TOO_MANY は, parents の数が上限を超えていること.
  FIELD_VIOLATION_REASON_PARENTS_TOO_MANY = 6;
  // FIELD_VIOLATION_REASON_PARENTS_DUPLICATE は, 同じ親が2回以上指定されていること. field は2つ目の親を指す.
  FIELD_VIOLATION_REASON_PARENTS_DUPLICATE = 7;
  // FIELD_VIOLATION_REASON_PARENTS_MISSING_EXPECTED_HEAD は, parents に expected_head が含まれていないこと.
  FIELD_VIOLATION_REASON_PARENTS_MISSING_EXPECTED_HEAD = 8;
  // FIELD_VIOLATION_REASON_PAGE_SIZE_NEGATIVE は, page_size が負の値であること.
  FIELD_VIOLATION_REASON_PAGE_SIZE_NEGATIVE = 9;
  // FIELD_VIOLATION_REASON_PAGE_TOKEN_MALFORMED は, page_token が, ListItems の返した next_page_token の形式ではないこと.
  FIELD_VIOLATION_REASON_PAGE_TOKEN_MALFORMED = 10;
  // FIELD_VIOLATION_REASON_PAGE_TOKEN_MISMATCH は, page_token を next_page_token として返したリクエストと, filter または order_by が異なること.
  FIELD_VIOLATION_REASON_PAGE_TOKEN_MISMATCH = 11;
  // FIELD_VIOLATION_REASON_BLOB_SHA256_REQUIRED は, 必須の blob_sha256 が空であること.
  FIELD_VIOLATION_REASON_BLOB_SHA256_REQUIRED = 12;
}
