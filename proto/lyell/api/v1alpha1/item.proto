syntax = "proto3";

package lyell.api.v1alpha1;

import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/yamaoki-lab/lyell/gen/lyell/api/v1alpha1;apiv1alpha1";

// Item は, 名前や中身が変わっても同じ対象を指し続ける記録. 中身の変遷は revision の列で持ち, item は現在の revision (head) を指す.
message Item {
  // id は item の ID (UUIDv7 をハイフン区切りの36文字で表記したもの). 作成後は変わらない.
  string id = 1;
  // kind は item の種類. 作成後は変わらない.
  ItemKind kind = 2;
  // head は, 現在指している revision の ID.
  string head = 3;
}

// ItemKind は item の種類.
enum ItemKind {
  // ITEM_KIND_UNSPECIFIED は, 種類が指定されていないこと. 受け取った場合は拒否する.
  ITEM_KIND_UNSPECIFIED = 0;
  // ITEM_KIND_ASSET は, 中身 (blob) がバイト列そのものである item.
  ITEM_KIND_ASSET = 1;
  // ITEM_KIND_COLLECTION は, 中身が, 他の item への参照の一覧である item. 一覧の形式が決まるまでは作成できない.
  ITEM_KIND_COLLECTION = 2;
}

// Revision は, item の中身の, ある時点の記録. 一度記録すると変わらない.
message Revision {
  // id は revision の ID (UUIDv7 をハイフン区切りの36文字で表記したもの).
  string id = 1;
  // item_id は, この revision が属する item の ID.
  string item_id = 2;
  // parents は, 1つ前の revision の ID. 最初の revision には存在しない. item の統合では, 別の item の revision も親になる. 現在は最大2つだが, 上限は今後引き上げる可能性があるため, 読み取る側は parents の数が2つ以下であることを前提としない.
  repeated string parents = 3;
  // content は中身. 間引かれていれば存在しないが, 親は辿れる.
  RevisionContent content = 4;
}

// RevisionContent は, revision の中身.
message RevisionContent {
  // create_time は, revision を記録した時刻. ミリ秒より細かい部分は切り捨てる.
  google.protobuf.Timestamp create_time = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // author_user は, 記録した利用者. 認証を実装するまでは, サーバが "anonymous" を設定する.
  string author_user = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // author_machine は, 記録したマシン. 認証を実装するまでは, サーバが "anonymous" を設定する.
  string author_machine = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // blob_sha256 は, 中身のバイト列 (blob) の SHA-256 を, 小文字の16進数64文字で表記したもの. バイト列は /lyell/api/v1alpha1/blobs/sha256/<blob_sha256> で読み取る.
  string blob_sha256 = 4;
  // blob_size は, 中身のバイト列のサイズ (バイト). ファイルシステムとして見せる時に, バイト列を取得せずにサイズを答えるため.
  int64 blob_size = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // name は, revision の名前. 空の場合は名前なしを表す. 名前はエクスポートやマウントの際にそのままファイル名になるため, どの一般的なファイルシステムでも変更なしに受け入れられる名前だけを受け付ける.
  // CreateItem または CommitRevision で名前を設定すると, 見た目を変えない修正を自動で施して保存し, レスポンスでは修正後の名前を返す. 修正は, ゼロ幅スペース (U+200B), BOM (U+FEFF), ソフトハイフン (U+00AD) および制御文字の削除, 改行とタブの1つのスペースへの置き換え, 前後の空白の除去, NFC への正規化 (CJK 互換漢字は字体を保つためそのまま残す) である.
  // 修正後の名前が規則を満たさなければ, INVALID_ARGUMENT を返す. 満たさない規則はすべて, FieldViolationReason の NAME_ で始まる理由として示す. 名前の候補を作成できる場合は, BadRequest と共に詳細情報に NameSuggestion を付与する. expected_head から引き継いだ名前は, 再検証しない.
  string name = 6;
}
